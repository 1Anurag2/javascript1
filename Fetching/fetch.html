<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fetching js</title>
  </head>

  <style>
    div {
      margin: 20px;
    }
  </style>

  <body>
    <form>
      <div>User Name : <input type="text" name="username" id="name" /></div>
    <div>Email :<input type="email" name="username" id="email" /></div>
    <div>
      Password : <input type="password" name="username" id="password" />
    </div>
    <div><input type="submit" value="submit" id="submit" /></div>
    </form>

    <script>
      document.getElementById('submit').addEventListener('click',function(e){
        e.preventDefault();

        var obj = {
          title : document.getElementById('name').value,
          body: document.getElementById('email').value,
          userId : document.getElementById('password').value,
      }
    fetch("https://jsonplaceholder.typicode.com/posts", {
      method: "POST",
      body: JSON.stringify(obj),
      headers: {
        "Content-type": "application/json; charset=UTF-8",
      },
    })
      .then((response) => response.json())
      .then((data) => console.log(data));
      })
        
    </script>
  </body>
</html>
