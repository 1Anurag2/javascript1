<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      try {
        let show = async () => {
          return (
            await fetch("https://jsonplaceholder.typicode.com/users")
          ).json();
        };
        show().then((res) => {
          for (let i in res) {
            document.write(res[i].name);
          }
        });
      } catch (err) {
        console.log(err);
      }
      console.log("1 : Message");

      
    </script>
  </body>
</html>
